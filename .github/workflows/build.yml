name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (Ubuntu)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            poppler-utils \
            qpdf \
            ffmpeg \
            texlive-xetex \
            texlive-latex-recommended \
            fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -v

      - name: Build Linux application
        run: |
          python -m PyInstaller \
            --clean \
            --noconfirm \
            --onedir \
            --name odt2epub \
            --distpath build/pyinstaller \
            --workpath build/pyinstaller-work \
            convert.py

          package="$PWD/build/package"
          mkdir -p "$package/tools/bin"
          cp -a build/pyinstaller/odt2epub/. "$package/"

          for command in pandoc pdfinfo pdftotext pdftoppm qpdf ffmpeg xelatex; do
            cp -L -- "$(command -v "$command")" "$package/tools/bin/$command"
          done
          for tex_package in texlive-binaries texlive-xetex texlive-latex-base; do
            while IFS= read -r executable; do
              if [[ "$executable" == /usr/bin/* && -f "$executable" && -x "$executable" ]]; then
                cp -L -- "$executable" "$package/tools/bin/$(basename "$executable")"
              fi
            done < <(dpkg-query -L "$tex_package")
          done

          mkdir -p "$package/tools/share" "$package/tools/etc" "$package/tools/var"
          if [[ -d /usr/share/texlive ]]; then
            cp -a /usr/share/texlive "$package/tools/share/"
          fi
          if [[ -d /etc/texmf ]]; then
            cp -a /etc/texmf "$package/tools/etc/"
          fi
          if [[ -d /var/lib/texmf ]]; then
            cp -a /var/lib/texmf "$package/tools/var/"
          fi
          if [[ -d /usr/share/fonts/truetype/dejavu ]]; then
            mkdir -p "$package/tools/fonts"
            cp -a /usr/share/fonts/truetype/dejavu/. "$package/tools/fonts/"
            if [[ -f /usr/share/doc/fonts-dejavu-core/copyright ]]; then
              cp /usr/share/doc/fonts-dejavu-core/copyright "$package/tools/fonts/COPYRIGHT.txt"
            fi
          fi

          cat > "$package/run.sh" <<'EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          root="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          tools="$root/tools"
          export PATH="$tools/bin:$PATH"
          export TEXMFROOT="$tools/share/texlive"
          export TEXMFCNF="$tools/etc/texmf:$tools/var/lib/texmf/web2c:$TEXMFROOT/texmf-dist/web2c"
          export OSFONTDIR="$tools/fonts"
          exec "$root/odt2epub" "$@"
          EOF
          chmod +x "$package/run.sh"

          cat > "$package/README.txt" <<'EOF'
          Run the application with ./run.sh [arguments].
          This archive includes the external command-line tools and TeX data.
          On Linux, compatible system shared libraries may still be required.
          EOF

          tar -czf build/odt2epub-ubuntu.tar.gz -C build/package .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: odt2epub-ubuntu
          path: build/odt2epub-ubuntu.tar.gz
          if-no-files-found: error
