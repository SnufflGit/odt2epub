name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (Ubuntu)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            poppler-utils \
            qpdf \
            ffmpeg \
            texlive-xetex \
            texlive-latex-recommended \
            fonts-dejavu-core \
            fontconfig \
            dpkg-dev \
            flatpak \
            flatpak-builder

      - name: Install Flatpak SDK
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -v

      - name: Build Linux application
        run: |
          python -m PyInstaller \
            --clean \
            --noconfirm \
            --onedir \
            --name odt2epub \
            --distpath build/pyinstaller \
            --workpath build/pyinstaller-work \
            convert.py

          package="$PWD/build/package"
          mkdir -p "$package/tools/bin"
          cp -a build/pyinstaller/odt2epub/. "$package/"

          for command in pandoc pdfinfo pdftotext pdftoppm qpdf ffmpeg xelatex fc-cache fc-match; do
            cp -L -- "$(command -v "$command")" "$package/tools/bin/$command"
          done
          for tex_package in texlive-binaries texlive-xetex texlive-latex-base; do
            while IFS= read -r executable; do
              if [[ "$executable" == /usr/bin/* && -f "$executable" && -x "$executable" ]]; then
                cp -L -- "$executable" "$package/tools/bin/$(basename "$executable")"
              fi
            done < <(dpkg-query -L "$tex_package")
          done

          mkdir -p "$package/tools/share" "$package/tools/etc" "$package/tools/var"
          if [[ -d /usr/share/texlive ]]; then
            cp -a /usr/share/texlive "$package/tools/share/"
          fi
          if [[ -d /etc/texmf ]]; then
            cp -a /etc/texmf "$package/tools/etc/"
          fi
          if [[ -d /var/lib/texmf ]]; then
            cp -a /var/lib/texmf "$package/tools/var/"
          fi
          if [[ -d /usr/share/fonts/truetype/dejavu ]]; then
            mkdir -p "$package/tools/fonts"
            cp -a /usr/share/fonts/truetype/dejavu/. "$package/tools/fonts/"
            if [[ -f /usr/share/doc/fonts-dejavu-core/copyright ]]; then
              cp /usr/share/doc/fonts-dejavu-core/copyright "$package/tools/fonts/COPYRIGHT.txt"
            fi
          fi
          cat > "$package/tools/fonts.conf" <<'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <dir prefix="relative">fonts</dir>
            <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
            <cachedir prefix="xdg">fontconfig</cachedir>
          </fontconfig>
          EOF

          cat > "$package/run.sh" <<'EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          root="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          tools="$root/tools"
          export PATH="$tools/bin:$PATH"
          export TEXMFROOT="$tools/share/texlive"
          export TEXMFCNF="$tools/etc/texmf:$tools/var/lib/texmf/web2c:$TEXMFROOT/texmf-dist/web2c"
          export OSFONTDIR="$tools/fonts"
          export FONTCONFIG_FILE="$tools/fonts.conf"
          if [[ -d "$tools/lib" ]]; then
            export LD_LIBRARY_PATH="$tools/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          exec "$root/odt2epub" "$@"
          EOF
          chmod +x "$package/run.sh"

          cat > "$package/README.txt" <<'EOF'
          After installing the Debian package, run: odt2epub [arguments].
          The application and bundled tools are stored in /opt/odt2epub.
          EOF

          deb_root="$PWD/build/deb-root"
          install_dir="$deb_root/opt/odt2epub"
          architecture="$(dpkg --print-architecture)"
          version="0.1.${GITHUB_RUN_NUMBER}"
          dpkg --validate-version "$version"
          mkdir -p "$install_dir" "$deb_root/usr/bin" "$deb_root/DEBIAN" build/debian
          cp -a "$package/." "$install_dir/"

          cat > "$deb_root/usr/bin/odt2epub" <<'EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          exec /opt/odt2epub/run.sh "$@"
          EOF
          chmod 0755 "$deb_root/usr/bin/odt2epub"

          cat > build/debian/control <<EOF
          Source: odt2epub
          Section: utils
          Priority: optional
          Maintainer: odt2epub maintainers <noreply@github.com>

          Package: odt2epub
          Architecture: $architecture
          Description: ODT, EPUB, Markdown, PDF and TXT converter
           Command-line document converter with bundled external tools.
          EOF

          elf_files=()
          while IFS= read -r -d '' candidate; do
            if [[ "$(od -An -tx1 -N4 "$candidate" | tr -d ' \n')" == "7f454c46" ]]; then
              elf_files+=("$candidate")
            fi
          done < <(find "$install_dir" -type f \
            \( -perm /111 -o -name '*.so' -o -name '*.so.*' \) -print0)
          if ((${#elf_files[@]} == 0)); then
            echo "No ELF binaries found in the application bundle." >&2
            exit 1
          fi

          shlib_args=()
          for binary in "${elf_files[@]}"; do
            shlib_args+=("-e$binary")
          done
          shlib_output="$(cd build && dpkg-shlibdeps -O -S"$deb_root" "${shlib_args[@]}")"
          depends="${shlib_output#shlibs:Depends=}"
          if [[ "$depends" == "$shlib_output" || -z "$depends" ]]; then
            echo "Could not determine shared-library dependencies for the Debian package." >&2
            exit 1
          fi
          for required_dependency in fontconfig perl; do
            if ! grep -Eq "(^|, )${required_dependency}( \\(|,|$)" <<< "$depends"; then
              depends+=", ${required_dependency}"
            fi
          done

          cat > "$deb_root/DEBIAN/control" <<EOF
          Package: odt2epub
          Version: $version
          Section: utils
          Priority: optional
          Architecture: $architecture
          Maintainer: odt2epub maintainers <noreply@github.com>
          Depends: $depends
          Description: ODT, EPUB, Markdown, PDF and TXT converter
           Command-line document converter with bundled external tools.
          EOF
          chmod 0755 "$deb_root/DEBIAN"
          chmod 0644 "$deb_root/DEBIAN/control"

          dpkg-deb --root-owner-group --build \
            "$deb_root" "build/odt2epub_${version}_${architecture}.deb"

          flatpak_files="$PWD/build/flatpak-files"
          mkdir -p "$flatpak_files/lib"
          cp -a "$package/." "$flatpak_files/"
          for binary in "${elf_files[@]}"; do
            ldd_output="$(ldd "$binary" 2>&1 || true)"
            if grep -q 'not found' <<< "$ldd_output"; then
              echo "Unresolved shared library while preparing Flatpak: $binary" >&2
              echo "$ldd_output" >&2
              exit 1
            fi
            while IFS= read -r library; do
              library_name="$(basename "$library")"
              case "$library_name" in
                libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*|libresolv.so.*|libanl.so.*|libutil.so.*|libnss_*.so.*|ld-linux*.so.*)
                  continue
                  ;;
              esac
              resolved_library="$(readlink -f "$library")"
              if [[ "$resolved_library" == "$install_dir"/* ]]; then
                continue
              fi
              cp -L -- "$library" "$flatpak_files/lib/$library_name"
            done < <(awk '$2 == "=>" && $3 ~ /^\// {print $3} $1 ~ /^\// {print $1}' <<< "$ldd_output")
          done

          cat > "$flatpak_files/flatpak-launcher" <<'EOF'
          #!/usr/bin/env sh
          set -eu
          export LD_LIBRARY_PATH="/app/lib/odt2epub/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec /app/lib/odt2epub/run.sh "$@"
          EOF
          chmod 0755 "$flatpak_files/flatpak-launcher"

          mkdir -p build/flatpak/repo
          flatpak-builder --user --force-clean \
            --repo=build/flatpak/repo \
            build/flatpak/build-dir \
            flatpak/io.github.snufflgit.odt2epub.yml
          flatpak build-bundle \
            build/flatpak/repo \
            build/odt2epub.flatpak \
            io.github.snufflgit.odt2epub \
            stable

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: odt2epub-ubuntu-deb
          path: build/odt2epub_*.deb
          if-no-files-found: error

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: odt2epub-flatpak
          path: build/odt2epub.flatpak
          if-no-files-found: error
